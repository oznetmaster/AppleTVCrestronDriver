name: Release Package

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    env:
      MANIFESTUTIL_VERSION: 27.0.24
      OFFICE_CORE_VERSION: 12.0.0
      WORD_INTEROP_VERSION: 15.0.4797.1004
      NET472_REFERENCE_ASSEMBLIES: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2
      NETFX_RUNTIME_DIR: C:\Windows\Microsoft.NET\Framework64\v4.0.30319
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out AppleTVControlLibrary
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/oznetmaster/AppleTVControlLibrary.git "$(Split-Path $env:GITHUB_WORKSPACE -Parent)\AppleTVControlLibrary"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install ILRepack tool
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ilrepack --version 2.0.45
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install ManifestUtil package
        shell: pwsh
        run: |
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version $env:MANIFESTUTIL_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Install Word interop package
        shell: pwsh
        run: |
          nuget install Microsoft.Office.Interop.Word -Version $env:WORD_INTEROP_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Install Office core package
        shell: pwsh
        run: |
          nuget install Microsoft.Office.Core -Version $env:OFFICE_CORE_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Resolve ManifestUtil path
        id: manifestutil
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Crestron.DeviceDrivers.ManifestUtil.$env:MANIFESTUTIL_VERSION"
          $manifestUtil = Get-ChildItem -Path $toolRoot -Filter ManifestUtil.exe -Recurse | Select-Object -First 1
          if ($null -eq $manifestUtil) {
            throw "ManifestUtil.exe was not found under $toolRoot"
          }

          $wordInteropRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Microsoft.Office.Interop.Word.$env:WORD_INTEROP_VERSION"
          $wordInterop = Get-ChildItem -Path $wordInteropRoot -Filter Microsoft.Office.Interop.Word.dll -Recurse | Select-Object -First 1
          if ($null -eq $wordInterop) {
            throw "Microsoft.Office.Interop.Word.dll was not found under $wordInteropRoot"
          }

          $officeCoreRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Microsoft.Office.Core.$env:OFFICE_CORE_VERSION"
          $officeCore = Get-ChildItem -Path $officeCoreRoot -Filter office.dll -Recurse | Select-Object -First 1
          if ($null -eq $officeCore) {
            throw "office.dll was not found under $officeCoreRoot"
          }

          Copy-Item $wordInterop.FullName (Join-Path $manifestUtil.Directory.FullName 'Microsoft.Office.Interop.Word.dll') -Force
          Copy-Item $officeCore.FullName (Join-Path $manifestUtil.Directory.FullName 'office.dll') -Force

          $manifestUtilConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <runtime>
              <assemblyBinding xmlns="urn:schemas-microsoft-com:asm.v1">
                <dependentAssembly>
                  <assemblyIdentity name="office" publicKeyToken="71e9bce111e9429c" culture="neutral" />
                  <bindingRedirect oldVersion="0.0.0.0-15.0.0.0" newVersion="12.0.0.0" />
                </dependentAssembly>
              </assemblyBinding>
            </runtime>
          </configuration>
          '@
          Set-Content -Path (Join-Path $manifestUtil.Directory.FullName 'ManifestUtil.exe.config') -Value $manifestUtilConfig -Encoding UTF8

          "exe_path=$($manifestUtil.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore dependencies
        run: dotnet restore AppleTVCrestronDriver/AppleTVCrestronDriver.csproj

      - name: Write release notes
        id: release_notes
        shell: pwsh
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Reuses the published GitHub Release's description as the NuGet package's release notes, so the
          # two stay in sync without duplicating the text. For an actual "release" event this comes directly
          # from the event payload. A manual workflow_dispatch run has no release body in its event payload,
          # so instead look up the existing GitHub Release for the ref it was run against (e.g. a tag like
          # v1.4.1) via the API and reuse its body; if no such release exists (e.g. run against a branch),
          # the NuGet package simply omits notes.
          $notes = $env:RELEASE_BODY
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = gh release view $env:GITHUB_REF_NAME --json body --jq '.body' 2>$null
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          if (-not [string]::IsNullOrWhiteSpace($notes)) {
            Set-Content -Path $notesPath -Value $notes -Encoding UTF8 -NoNewline
            "path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            "path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Verify driver version rules
        shell: pwsh
        run: ./tools/Test-DriverVersioning.ps1

      - name: Determine release version
        id: package_version
        shell: pwsh
        run: |
          $refName = if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:GITHUB_EVENT_PATH) {
            (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).release.tag_name
          } else { $env:GITHUB_REF_NAME }
          $selected = & ./tools/Get-DriverReleaseVersion.ps1 -ManifestPath @('./AppleTVCrestronDriver/AppleTVCrestronDriver.json', './AppleTVCrestronExtensionDriver/AppleTVCrestronExtensionDriver.json') -Tag $refName -RequireTag:($env:GITHUB_EVENT_NAME -eq 'release')
          "value=$($selected.PackageVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "driver=$($selected.DriverReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($selected.Tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release package
        shell: pwsh
        run: |
          # Builds only the two driver projects directly (not the whole .slnx): building the solution
          # also builds AppleTVCrestronDriver.Tests.csproj, whose ProjectReferences to these same two
          # driver projects (with Properties="DeployAfterBuild=false") make MSBuild schedule a second,
          # concurrent build request for each driver project writing into the very same bin/obj output
          # directory as the top-level solution entry - both running their ILRepack post-build merge
          # step against the same files at once, intermittently producing MSB3027/CS2012 "process
          # cannot access the file" failures. Building just these two projects avoids that duplicate
          # build request entirely.
          dotnet build AppleTVCrestronDriver/AppleTVCrestronDriver.csproj -c Release -p:ManifestUtilExe="${{ steps.manifestutil.outputs.exe_path }}" -p:LocalNet472ReferenceAssemblies="$env:NET472_REFERENCE_ASSEMBLIES" -p:LocalNetFxRuntimeDir="$env:NETFX_RUNTIME_DIR" -p:MergeDependenciesContinueOnError=false -p:PackageDriverContinueOnError=false -p:PackageDriverIgnoreExitCode=false -p:DriverReleaseVersion="${{ steps.package_version.outputs.driver }}"
          dotnet build AppleTVCrestronExtensionDriver/AppleTVCrestronExtensionDriver.csproj -c Release -p:ManifestUtilExe="${{ steps.manifestutil.outputs.exe_path }}" -p:LocalNet472ReferenceAssemblies="$env:NET472_REFERENCE_ASSEMBLIES" -p:LocalNetFxRuntimeDir="$env:NETFX_RUNTIME_DIR" -p:MergeDependenciesContinueOnError=false -p:PackageDriverContinueOnError=false -p:PackageDriverIgnoreExitCode=false -p:DriverReleaseVersion="${{ steps.package_version.outputs.driver }}"

      - name: Locate video server package
        id: package
        shell: pwsh
        run: |
          $pkg = Get-Item -LiteralPath "$env:GITHUB_WORKSPACE\AppleTVCrestronDriver\bin\Release\net472\AppleTVCrestronCloudDriver.pkg" -ErrorAction Stop
          if ($null -eq $pkg) {
            throw 'No .pkg file was generated in AppleTVCrestronDriver/bin/Release.'
          }

          & ./tools/Assert-DriverPackageVersion.ps1 -PackagePath $pkg.FullName -ManifestPath './AppleTVCrestronDriver/AppleTVCrestronDriver.json' -ReleaseVersion '${{ steps.package_version.outputs.value }}'

          "pkg_path=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Locate extension package
        id: extension_package
        shell: pwsh
        run: |
          $pkg = Get-Item -LiteralPath "$env:GITHUB_WORKSPACE\AppleTVCrestronExtensionDriver\bin\Release\net472\AppleTVCrestronExtensionDriver.pkg" -ErrorAction Stop
          if ($null -eq $pkg) {
            throw 'No .pkg file was generated in AppleTVCrestronExtensionDriver/bin/Release.'
          }

          & ./tools/Assert-DriverPackageVersion.ps1 -PackagePath $pkg.FullName -ManifestPath './AppleTVCrestronExtensionDriver/AppleTVCrestronExtensionDriver.json' -ReleaseVersion '${{ steps.package_version.outputs.value }}'

          "pkg_path=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Pack video server NuGet package
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'nuget-package'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'crestron-driver-package.json'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $manifest = @{
            standardVersion = '1.0'
            packageType = 'CrestronHomeDriver'
            driverPlatform = 'Crestron Home'
            payloadType = 'pkg'
            payloadFile = [System.IO.Path]::GetFileName("${{ steps.package.outputs.pkg_path }}")
            containsManagedDllPayload = $false
            packageId = 'CrestronHomeDriver.Apple.AppleTV'
            packageVersion = "${{ steps.package_version.outputs.value }}"
            displayName = 'AppleTV Driver'
            vendor = 'Apple'
            driverCategory = 'Video Server'
          } | ConvertTo-Json -Depth 5

          Set-Content -Path $manifestPath -Value $manifest -Encoding UTF8

          dotnet pack AppleTVCrestronDriver/AppleTVCrestronDriver.csproj -c Release --no-build --output $outputDir -p:PackageVersion="${{ steps.package_version.outputs.value }}" -p:PackageDriverPkgPath="${{ steps.package.outputs.pkg_path }}" -p:PackageDriverManifestPath="$manifestPath" -p:PackageReleaseNotesFile="${{ steps.release_notes.outputs.path }}"

      - name: Pack extension NuGet package
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'nuget-package'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'crestron-driver-extension-package.json'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $manifest = @{
            standardVersion = '1.0'
            packageType = 'CrestronHomeDriver'
            driverPlatform = 'Crestron Home'
            payloadType = 'pkg'
            payloadFile = [System.IO.Path]::GetFileName("${{ steps.extension_package.outputs.pkg_path }}")
            containsManagedDllPayload = $false
            packageId = 'CrestronHomeDriver.Apple.AppleTVExtension'
            packageVersion = "${{ steps.package_version.outputs.value }}"
            displayName = 'AppleTV Extension Driver'
            vendor = 'Apple'
            driverCategory = 'Extension'
          } | ConvertTo-Json -Depth 5

          Set-Content -Path $manifestPath -Value $manifest -Encoding UTF8

          dotnet pack AppleTVCrestronExtensionDriver/AppleTVCrestronExtensionDriver.csproj -c Release --no-build --output $outputDir -p:PackageVersion="${{ steps.package_version.outputs.value }}" -p:PackageDriverPkgPath="${{ steps.extension_package.outputs.pkg_path }}" -p:PackageDriverManifestPath="$manifestPath" -p:PackageReleaseNotesFile="${{ steps.release_notes.outputs.path }}"

      - name: Locate video server NuGet package
        id: nuget_package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'nuget-package') -Filter 'CrestronHomeDriver.Apple.AppleTV.*.nupkg' -File |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' -and $_.Name -notlike 'CrestronHomeDriver.Apple.AppleTVExtension.*' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $nupkg) {
            throw 'No video server NuGet package (.nupkg) was generated.'
          }

          "nupkg_path=$($nupkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Locate extension NuGet package
        id: extension_nuget_package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'nuget-package') -Filter 'CrestronHomeDriver.Apple.AppleTVExtension.*.nupkg' -File |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $nupkg) {
            throw 'No extension NuGet package (.nupkg) was generated.'
          }

          "nupkg_path=$($nupkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NUGET_API_KEY secret is not configured.'
          }

          dotnet nuget push "${{ steps.nuget_package.outputs.nupkg_path }}" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "${{ steps.extension_nuget_package.outputs.nupkg_path }}" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVCrestronDriver-pkg
          path: |
            ${{ steps.package.outputs.pkg_path }}
            ${{ steps.extension_package.outputs.pkg_path }}
          if-no-files-found: error

      - name: Upload package assets
        # Only attach assets to an actual GitHub Release, not a manual workflow_dispatch run: for
        # workflow_dispatch, github.event.release.tag_name is empty and github.ref_name falls back to
        # the branch/ref the workflow was triggered against (e.g. "main"), which would otherwise cause
        # softprops/action-gh-release to create/target a bogus release tagged after that branch.
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.package.outputs.pkg_path }}
            ${{ steps.extension_package.outputs.pkg_path }}
          fail_on_unmatched_files: true